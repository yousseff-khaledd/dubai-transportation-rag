<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-label="Chat graph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><text x="600" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#10283f">Chat graph</text><rect x="495" y="78" width="210" height="56" rx="16" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="106.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">Start</text><rect x="435" y="178" width="330" height="78" rx="16" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="206.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">input_guard</text><text x="600.0" y="235.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Validate and reset question state</text><rect x="435" y="302" width="330" height="78" rx="16" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="330.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">question_guard</text><text x="600.0" y="359.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Plan question and choose route</text><rect x="73" y="453" width="330" height="78" rx="16" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.5"/><text x="238.0" y="481.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">ask_clarification</text><text x="238.0" y="510.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Pause for user response</text><rect x="435" y="453" width="330" height="78" rx="16" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="481.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">retrieve_evidence</text><text x="600.0" y="510.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Run the retrieval graph</text><rect x="435" y="606" width="330" height="78" rx="16" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="634.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">draft_answer</text><text x="600.0" y="663.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Produce answer and citations</text><rect x="435" y="762" width="330" height="78" rx="16" fill="#ede9fe" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="790.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">response_guard</text><text x="600.0" y="819.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Validate and record response</text><rect x="495" y="906" width="210" height="56" rx="16" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="934.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">End</text><path d="M 600 134 V 178" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 256 V 302" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 380 V 453" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="657" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#475569">retrieve</text><path d="M 435 340 H 238 V 453" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="255" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#475569">needs clarification</text><path d="M 238 531 V 580 H 35 V 340 H 435" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="230" y="604" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#475569">resume → replan</text><path d="M 765 340 H 1034 V 801 H 765" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="977" y="323" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#475569">out of scope / limit</text><path d="M 600 531 V 606" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 684 V 762" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 840 V 906" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/></svg>
