<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-label="Retrieval graph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><text x="600" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#10283f">Retrieval graph</text><rect x="495" y="78" width="210" height="56" rx="16" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="106.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">Start</text><rect x="435" y="180" width="330" height="78" rx="16" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="208.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">Select search mode</text><text x="600.0" y="237.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">lexical, semantic, or hybrid</text><rect x="120" y="326" width="330" height="78" rx="16" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><text x="285.0" y="354.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">lexical_search</text><text x="285.0" y="383.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">SQLite FTS5 / BM25</text><rect x="750" y="326" width="330" height="78" rx="16" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><text x="915.0" y="354.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10283f">semantic_search</text><text x="915.0" y="383.0" text-anchor="middle"